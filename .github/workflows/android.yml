name: WayCore APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK de WayCore
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar WayCore (APK instalable)
        env:
          # Opcional: crea el secreto GEMINI_API_KEY en Settings > Secrets and variables
          # > Actions del repositorio para compilar el APK ya con la clave de Gemini.
          ORG_GRADLE_PROJECT_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: gradle assembleDebug --stacktrace

      - name: Renombrar el APK
        shell: bash
        run: |
          VER=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          cp app/build/outputs/apk/debug/app-debug.apk "WayCore-v${VER}.apk"
          ls -lh *.apk

      - name: Subir el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: waycore-apk
          path: WayCore-v*.apk
          retention-days: 90

      - name: Crear Release al publicar un tag v*
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WayCore-v*.apk
          generate_release_notes: true
