name: Build APK

on:
  push:
    branches: [arena/01a0d15b-waycore30, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Configurar clave de Gemini
        run: |
          if [ -n "${GEMINI_API_KEY:-}" ]; then
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > local.properties
            echo "Clave de Gemini configurada para el build."
          else
            echo "::warning::No existe el secreto GEMINI_API_KEY; el APK quedara sin clave."
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Preparar artefacto
        run: |
          VERSION=$(grep versionName app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/WayCore-v${VERSION}.apk"
          sha256sum "dist/WayCore-v${VERSION}.apk" > "dist/WayCore-v${VERSION}.apk.sha256"
          cat "dist/WayCore-v${VERSION}.apk.sha256"

      - name: Subir artefacto del build
        uses: actions/upload-artifact@v4
        with:
          name: WayCore-APK
          path: dist/*
          if-no-files-found: error

      - name: Publicar release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: WayCore v${{ env.VERSION }}
          make_latest: true
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/*.sha256
          body: |
            APK de WayCore listo para instalar.

            Novedades:
            - Al abrir la app por primera vez te pide tu clave API de Gemini; la guardas una vez y Karbys funciona sola.
            - Karbys dice "¿Dime?" con su voz en lugar del pitido antes de escucharte.
            - Palabra clave mucho más confiable (acepta variantes como "Oye Karbys", "Hey Karbis" o solo "Karbys").
            - Puedes decir tu pregunta junto con la palabra clave: "Oye Karbys, ¿qué hora es?".
            - La pausa por voz ahora funciona y se reactiva diciendo "Oye Karbys".

            Instalación: descarga el archivo .apk en tu teléfono Android, ábrelo, acepta la instalación y pega tu clave API de Gemini cuando la app te la pida.

      - name: Copiar APK a la rama apk/latest
        run: |
          git config user.name "WayCore Bot"
          git config user.email "waycore-bot@users.noreply.github.com"
          git checkout --orphan apk-latest
          git reset
          git add -f "dist/WayCore-v${VERSION}.apk" "dist/WayCore-v${VERSION}.apk.sha256"
          git commit -m "APK WayCore v${VERSION} (build $GITHUB_RUN_NUMBER)"
          git push -f origin apk-latest
